<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e3f46" />
    <title>Majestic Lawbook</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div class="project-identity">
          <div id="activeProjectMark" class="project-mark" aria-hidden="true">B</div>
          <div>
            <p id="projectEyebrow" class="eyebrow">Majestic RP</p>
            <h1 id="projectTitle">Lawbook</h1>
            <p id="projectNote" class="project-note"></p>
          </div>
        </div>
        <div id="projectSwitch" class="project-switch" aria-label="Переключение проекта"></div>
      </header>

      <main>
        <section class="search-panel">
          <label class="search-box" for="searchInput">
            <span>⌕</span>
            <input
              id="searchInput"
              type="search"
              inputmode="search"
              placeholder="Статья, наказание или описание"
              autocomplete="off"
            />
          </label>
          <div id="quickChips" class="chip-row" aria-label="Быстрые фильтры"></div>
        </section>

        <nav id="tabs" class="tabs" aria-label="Разделы законки"></nav>

        <section class="summary-grid" aria-label="Сводка">
          <article>
            <span id="countArticles">0</span>
            <p>статей</p>
          </article>
          <article>
            <span id="countSources">0</span>
            <p>источников</p>
          </article>
          <article>
            <span id="countFavorites">0</span>
            <p>избранных</p>
          </article>
        </section>

        <section id="results" class="results" aria-live="polite"></section>
      </main>

      <aside id="detailSheet" class="detail-sheet" aria-hidden="true">
        <div class="sheet-panel">
          <div class="sheet-grip"></div>
          <div class="sheet-header">
            <div>
              <p id="detailCode" class="eyebrow"></p>
              <h2 id="detailTitle"></h2>
            </div>
            <button id="detailClose" class="icon-button" type="button" title="Закрыть">×</button>
          </div>
          <div class="detail-meta">
            <span id="detailArticle"></span>
            <span id="detailHierarchy"></span>
            <span id="detailUpdated"></span>
          </div>
          <p id="detailText" class="detail-text"></p>
          <div id="detailPenalty" class="penalty"></div>
          <a id="detailSource" class="source-link" href="#" target="_blank" rel="noreferrer">Открыть источник</a>
        </div>
      </aside>
    </div>

    <script src="./laws.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
